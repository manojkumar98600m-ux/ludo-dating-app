name: Build Ludo Dating Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest repository files
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare app from the CURRENT website files (not old ZIP archives)
        run: |
          mkdir -p app/www app/assets
          cp -R website/. app/www/
          cp branding/ludo-dating-icon.svg app/assets/icon.svg
          cat > app/package.json <<'EOF'
          {
            "name": "ludo-dating-app",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {"build": "node -e \"console.log('Static website copied to www')\""}
          }
          EOF
          cat > app/capacitor.config.json <<'EOF'
          {
            "appId": "com.manojkumar.ludodating",
            "appName": "Ludo Dating",
            "webDir": "www",
            "server": {"androidScheme": "https"}
          }
          EOF

      - name: Install Capacitor and icon tooling
        working-directory: app
        run: |
          npm install --no-audit --no-fund @capacitor/core @capacitor/android
          npm install --no-audit --no-fund --save-dev @capacitor/cli @capacitor/assets sharp
          node -e "require('sharp')('assets/icon.svg').resize(1024,1024).png().toFile('assets/icon.png').then(()=>console.log('Branded icon created')).catch(e=>{console.error(e);process.exit(1)})"
          cp assets/icon.png assets/splash.png

      - name: Create Android project and generate branded icons
        working-directory: app
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ludo-dating-app-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
