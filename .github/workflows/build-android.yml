name: Build Ludo Dating Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          mkdir -p app
          unzip -q ludo-dating-app-main.zip -d app
          SOURCE_DIR="$(find app -name package.json -print -quit | xargs -r dirname)"
          if [ -z "$SOURCE_DIR" ]; then
            echo "package.json was not found in ludo-dating-app-main.zip"
            find app -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/**/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm run build

      - name: Prepare Android platform
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            echo "Capacitor config is missing from the source archive."
            exit 1
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-dating-app-debug-apk
          path: ${{ env.SOURCE_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
