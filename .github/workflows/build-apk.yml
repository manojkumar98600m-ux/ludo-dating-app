name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ludo-dating-app-source.zip"
      - "scripts/build-frontend.mjs"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build website files
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Configure Capacitor for Android
        working-directory: app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.manojkumar.ludodating",
            "appName": "Ludo Dating App",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npm install --no-audit --no-fund @capacitor/core @capacitor/android
          npm install --no-audit --no-fund --save-dev @capacitor/cli

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-dating-app-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
