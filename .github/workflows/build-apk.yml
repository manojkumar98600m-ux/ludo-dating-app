name: Build Android APK and Play Store Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - "ludo-dating-app-source.zip"
      - "scripts/build-frontend.mjs"
      - ".github/workflows/build-apk.yml"
      - "branding/**"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build website files
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Create branded app icon
        run: |
          npm install --no-save --no-package-lock sharp
          mkdir -p app/assets
          node -e "require('sharp')('branding/ludo-dating-icon.svg').resize(1024,1024).png().toFile('app/assets/icon-only.png').then(()=>console.log('Icon created')).catch(e=>{console.error(e);process.exit(1)})"
          cp app/assets/icon-only.png app/assets/splash.png

      - name: Configure Capacitor for Android
        working-directory: app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.manojkumar.ludodating",
            "appName": "Ludo Dating App",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npm install --no-audit --no-fund @capacitor/core @capacitor/android
          npm install --no-audit --no-fund --save-dev @capacitor/cli @capacitor/assets

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK for device testing
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build release Android App Bundle
        working-directory: app/android
        run: ./gradlew bundleRelease

      - name: Upload test APK
        uses: actions/upload-artifact@v6
        with:
          name: ludo-dating-app-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store AAB (unsigned)
        uses: actions/upload-artifact@v6
        with:
          name: ludo-dating-play-store-aab-unsigned
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
